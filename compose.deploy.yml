services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      API_PORT: "4000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:

name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: businessos_ci
          POSTGRES_USER: businessos
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U businessos -d businessos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://businessos:ci-only-password@localhost:5432/businessos_ci?schema=public
      TEST_DATABASE_URL: postgresql://businessos:ci-only-password@localhost:5432/businessos_ci?schema=public
      JWT_SECRET: ci-only-secret-not-for-deployment-0123456789
      WEB_ORIGIN: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @businessos/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @businessos/api exec prisma migrate deploy
      - name: Check migration status
        run: pnpm --filter @businessos/api exec prisma migrate status
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: PostgreSQL return transaction
        run: pnpm --filter @businessos/api test:db
      - name: Production build
        run: pnpm build

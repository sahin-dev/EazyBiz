services:
  postgres:
    image: postgres:16-alpine
    container_name: businessos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: businessos
      POSTGRES_USER: businessos
      POSTGRES_PASSWORD: businessos
    ports:
      - "5432:5432"
    volumes:
      - businessos_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: businessos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  businessos_postgres:
